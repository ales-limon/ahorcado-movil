<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ahorcado Pro Max</title>
    <style>
        :root { --p: #38bdf8; --bg: #0f172a; --s: #1e293b; --t: #f8fafc; --d: #f43f5e; --ok: #10b981; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--t); font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 10px; }
        .card { background: var(--s); width: 100%; max-width: 450px; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; position: relative; }
        .hidden { display: none !important; }
        
        .menu-btn { width: 100%; padding: 15px; margin: 8px 0; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; background: #334155; color: white; }
        .btn-primary { background: var(--p); color: #0f172a; }
        input { width: 100%; padding: 15px; border-radius: 10px; border: 2px solid #334155; background: #0f172a; color: white; text-align: center; font-size: 18px; margin-bottom: 10px; outline: none; }
        
        .stats { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; font-size: 14px; }
        #timer { color: var(--p); }
        #score-display { color: var(--ok); }
        
        #hangman-svg { width: 130px; height: 130px; stroke: white; stroke-width: 4; fill: none; margin: 10px auto; stroke-linecap: round; }
        .word-display { font-size: 28px; font-weight: bold; letter-spacing: 4px; margin: 15px 0; min-height: 40px; color: var(--p); text-transform: uppercase; }
        
        .keyboard { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .key { background: #334155; padding: 12px 0; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .key.hit { background: var(--ok); }
        .key.miss { background: var(--d); }
        .key.off { opacity: 0.2; pointer-events: none; }
        
        #msg { font-size: 1.2rem; font-weight: bold; margin: 10px 0; min-height: 1.5em; }
        .high-score { font-size: 12px; color: #94a3b8; margin-top: 5px; }
    </style>
</head>
<body>

<div class="card">
    <div id="m-main">
        <h1 style="margin:0">Ahorcado Pro</h1>
        <div class="high-score" id="high-score-text">Récord: 0 pts</div>
        <p style="color:#94a3b8; font-size:14px; margin: 15px 0;">¿Cómo quieres jugar hoy?</p>
        <button class="menu-btn btn-primary" onclick="setupGame('cpu')">Solo (vs Computadora)</button>
        <button class="menu-btn" onclick="setupGame('local')">Duelo (2 Jugadores)</button>
    </div>

    <div id="m-setup" class="hidden">
        <h2>Palabra Secreta</h2>
        <input type="password" id="secretInput" placeholder="Escribe la palabra aquí">
        <button class="menu-btn btn-primary" onclick="launchGame()">¡Empezar!</button>
        <button class="menu-btn" onclick="location.reload()">Cancelar</button>
    </div>

    <div id="m-game" class="hidden">
        <div class="stats">
            <span id="score-display">Pts: 0</span>
            <span id="timer">⏳ 00s</span>
        </div>
        
        <svg id="hangman-svg" viewBox="0 0 100 100">
            <path d="M20 90 L80 90 M30 90 L30 10 L70 10 L70 20" />
            <circle id="s0" class="hidden" cx="70" cy="30" r="10" />
            <line id="s1" class="hidden" x1="70" y1="40" x2="70" y2="65" />
            <line id="s2" class="hidden" x1="70" y1="48" x2="52" y2="38" />
            <line id="s3" class="hidden" x1="70" y1="48" x2="88" y2="38" />
            <line id="s4" class="hidden" x1="70" y1="65" x2="55" y2="82" />
            <line id="s5" class="hidden" x1="70" y1="65" x2="85" y2="82" />
        </svg>

        <div id="wordDisplay" class="word-display"></div>
        <div id="msg"></div>
        <div id="kb" class="keyboard"></div>
        
        <button id="btn-res" class="menu-btn hidden" style="margin-top:20px" onclick="location.reload()">Volver al Menú</button>
    </div>
</div>

<script>
    const dictionary = ["HERRERIA", "SOFTWARE", "DESARROLLO", "SISTEMA", "COMPUTADORA", "CELULAR", "AUTOLAVADO", "MEXICO", "INTELIGENCIA", "ALGORITMO"];
    let target = "";
    let status = [];
    let fails = 0;
    let mode = "";
    let timeLeft = 0;
    let timerInterval;
    let currentScore = 0;

    // Cargar récord al iniciar
    document.getElementById('high-score-text').innerText = `Récord: ${localStorage.getItem('hangman_highscore') || 0} pts`;

    function setupGame(m) {
        mode = m;
        if(mode === 'cpu') {
            launchGame();
        } else {
            document.getElementById('m-main').classList.add('hidden');
            document.getElementById('m-setup').classList.remove('hidden');
        }
    }

    async function launchGame() {
        if(mode === 'cpu') {
            document.getElementById('msg').innerText = "Buscando palabra...";
            document.getElementById('m-main').classList.add('hidden');
            document.getElementById('m-game').classList.remove('hidden');
            
            try {
                const res = await fetch('https://random-word-api.herokuapp.com/word?lang=es');
                const data = await res.json();
                target = data[0].toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            } catch (e) {
                target = dictionary[Math.floor(Math.random() * dictionary.length)];
            }
        } else {
            const val = document.getElementById('secretInput').value.trim().toUpperCase();
            if(val.length < 2) return alert("Escribe una palabra válida");
            target = val.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            document.getElementById('m-setup').classList.add('hidden');
            document.getElementById('m-game').classList.remove('hidden');
        }

        document.getElementById('msg').innerText = "";
        status = Array(target.length).fill("_");
        fails = 0;
        timeLeft = 20 + (target.length * 4); // Tiempo dinámico
        
        render();
        genKB();
        startTimer();
    }

    function startTimer() {
        clearInterval(timerInterval);
        updateTimerUI();
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerUI();
            if(timeLeft <= 0) end(false, "¡TIEMPO AGOTADO!");
        }, 1000);
    }

    function updateTimerUI() {
        const el = document.getElementById('timer');
        el.innerText = `⏳ ${timeLeft}s`;
        el.style.color = timeLeft <= 10 ? "var(--d)" : "var(--p)";
    }

    function genKB() {
        const container = document.getElementById('kb');
        container.innerHTML = "";
        "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("").forEach(l => {
            const d = document.createElement('div');
            d.className = 'key';
            d.innerText = l;
            d.onclick = () => play(l, d);
            container.appendChild(d);
        });
    }

    function play(l, el) {
        if(el.classList.contains('off') || timeLeft <= 0) return;
        el.classList.add('off');

        if(target.includes(l)) {
            el.classList.add('hit');
            for(let i=0; i<target.length; i++) if(target[i] === l) status[i] = l;
        } else {
            el.classList.add('miss');
            if(fails < 6) document.getElementById(`s${fails}`).classList.remove('hidden');
            fails++;
        }
        render();
        check();
    }

    function render() {
        document.getElementById('wordDisplay').innerText = status.join(" ");
    }

    function check() {
        if(!status.includes("_")) {
            // Calcular puntos: (Tiempo restante * 10) + (Letras adivinadas * 5)
            const points = (timeLeft * 10) + (target.length * 5);
            currentScore += points;
            document.getElementById('score-display').innerText = `Pts: ${currentScore}`;
            end(true, "¡GANASTE! 🎉");
        } else if(fails >= 6) {
            end(false, "EL AHORCADO GANÓ 💀");
        }
    }

    function end(win, txt) {
        clearInterval(timerInterval);
        const m = document.getElementById('msg');
        m.innerText = txt;
        m.style.color = win ? "var(--ok)" : "var(--d)";
        if(!win) m.innerHTML += `<br><span style="font-size:14px; color:#94a3b8">Era: ${target}</span>`;
        
        // Guardar récord
        const hi = localStorage.getItem('hangman_highscore') || 0;
        if(currentScore > hi) {
            localStorage.setItem('hangman_highscore', currentScore);
            m.innerHTML += `<br><span style="color:var(--p)">¡NUEVO RÉCORD!</span>`;
        }

        document.getElementById('kb').style.pointerEvents = 'none';
        document.getElementById('btn-res').classList.remove('hidden');
    }
</script>
</body>
</html>

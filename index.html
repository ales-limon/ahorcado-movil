<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ahorcado Pro Max</title>
    <style>
        :root { --p: #38bdf8; --bg: #0f172a; --s: #1e293b; --t: #f8fafc; --d: #f43f5e; --ok: #10b981; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--t); font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 10px; }
        .card { background: var(--s); width: 100%; max-width: 450px; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        .hidden { display: none !important; }
        
        /* UI Elements */
        .menu-btn { width: 100%; padding: 15px; margin: 8px 0; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; background: #334155; color: white; }
        .btn-primary { background: var(--p); color: #0f172a; }
        input { width: 100%; padding: 15px; border-radius: 10px; border: 2px solid #334155; background: #0f172a; color: white; text-align: center; font-size: 18px; margin-bottom: 10px; }
        
        /* Game HUD */
        .stats { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; color: var(--p); }
        #timer { font-size: 1.2rem; }
        #hangman-svg { width: 120px; height: 120px; stroke: white; stroke-width: 4; fill: none; margin: 10px auto; }
        .word-display { font-size: 30px; font-weight: bold; letter-spacing: 5px; margin: 15px 0; min-height: 40px; word-break: break-all; }
        
        /* Keyboard */
        .keyboard { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .key { background: #334155; padding: 12px 0; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; }
        .key.hit { background: var(--ok); }
        .key.miss { background: var(--d); }
        .key.off { opacity: 0.3; pointer-events: none; }
        
        #msg { font-size: 1.2rem; font-weight: bold; margin: 10px 0; }
        .difficulty-tag { font-size: 12px; padding: 4px 8px; border-radius: 5px; background: #475569; }
    </style>
</head>
<body>

<div class="card">
    <div id="m-main">
        <h1 style="margin:0 0 10px 0">Ahorcado Pro</h1>
        <p style="color:#94a3b8; font-size:14px">Selecciona modo de juego:</p>
        <button class="menu-btn btn-primary" onclick="showSetup('cpu')">Solo (vs Computadora)</button>
        <button class="menu-btn" onclick="showSetup('local')">Local (2 Jugadores - 1 Cel)</button>
        <button class="menu-btn" onclick="alert('Próximamente: Modo Multiplayer requiere Firebase. ¡Enfócate en ganar hoy!')" style="opacity:0.5">Online (Próximamente)</button>
    </div>

    <div id="m-setup" class="hidden">
        <h2 id="setup-title">Configuración</h2>
        <div id="input-area">
            <input type="password" id="secretInput" placeholder="Escribe la palabra">
        </div>
        <button class="menu-btn btn-primary" onclick="startGame()">¡A JUGAR!</button>
        <button class="menu-btn" onclick="location.reload()">Atrás</button>
    </div>

    <div id="m-game" class="hidden">
        <div class="stats">
            <span id="diff-label" class="difficulty-tag">Modo</span>
            <span id="timer">⏳ 00s</span>
        </div>
        
        <svg id="hangman-svg" viewBox="0 0 100 100">
            <path d="M20 90 L80 90 M30 90 L30 10 L70 10 L70 20" />
            <circle id="s0" class="hidden" cx="70" cy="30" r="10" />
            <line id="s1" class="hidden" x1="70" y1="40" x2="70" y2="65" />
            <line id="s2" class="hidden" x1="70" y1="48" x2="52" y2="38" />
            <line id="s3" class="hidden" x1="70" y1="48" x2="88" y2="38" />
            <line id="s4" class="hidden" x1="70" y1="65" x2="55" y2="82" />
            <line id="s5" class="hidden" x1="70" y1="65" x2="85" y2="82" />
        </svg>

        <div id="wordDisplay" class="word-display"></div>
        <div id="msg"></div>
        <div id="kb" class="keyboard"></div>
        
        <button id="btn-res" class="menu-btn hidden" style="margin-top:20px" onclick="location.reload()">Menú Principal</button>
    </div>
</div>

<script>
    const dictionary = ["PROGRAMACION", "HERRERIA", "AUTOMOVIL", "CELULAR", "DESARROLLADOR", "CIBERNETICA", "WHATSAPP", "JAVASCRIPT", "MEXICO", "AUTOLAVADO"];
    let target = "";
    let status = [];
    let fails = 0;
    let mode = "";
    let time = 0;
    let timerInterval;

    function showSetup(selectedMode) {
        mode = selectedMode;
        document.getElementById('m-main').classList.add('hidden');
        document.getElementById('m-setup').classList.remove('hidden');
        
        if(mode === 'cpu') {
            document.getElementById('setup-title').innerText = "Modo Solitario";
            document.getElementById('input-area').innerHTML = "<p>La computadora elegirá una palabra al azar.</p>";
        }
    }

    function startGame() {
        if(mode === 'cpu') {
            target = dictionary[Math.floor(Math.random() * dictionary.length)];
        } else {
            const val = document.getElementById('secretInput').value.trim().toUpperCase();
            if(val.length < 2) return alert("Mínimo 2 letras");
            target = val.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        status = Array(target.length).fill("_");
        fails = 0;
        
        // Tiempo dinámico: 15 seg base + 5 por letra
        time = 15 + (target.length * 5);
        
        document.getElementById('m-setup').classList.add('hidden');
        document.getElementById('m-game').classList.remove('hidden');
        document.getElementById('diff-label').innerText = mode === 'cpu' ? "CPU" : "PVP";
        
        render();
        genKB();
        startTimer();
    }

    function startTimer() {
        updateTimerText();
        timerInterval = setInterval(() => {
            time--;
            updateTimerText();
            if(time <= 0) end(false, "¡Se acabó el tiempo!");
        }, 1000);
    }

    function updateTimerText() {
        document.getElementById('timer').innerText = `⏳ ${time}s`;
        if(time <= 10) document.getElementById('timer').style.color = "var(--d)";
    }

    function genKB() {
        const letters = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("");
        const container = document.getElementById('kb');
        container.innerHTML = "";
        letters.forEach(l => {
            const d = document.createElement('div');
            d.className = 'key';
            d.innerText = l;
            d.onclick = () => guess(l, d);
            container.appendChild(d);
        });
    }

    function guess(l, el) {
        if(el.classList.contains('off')) return;
        el.classList.add('off');

        if(target.includes(l)) {
            el.classList.add('hit');
            for(let i=0; i<target.length; i++) if(target[i] === l) status[i] = l;
        } else {
            el.classList.add('miss');
            document.getElementById(`s${fails}`).classList.remove('hidden');
            fails++;
        }
        render();
        check();
    }

    function render() {
        document.getElementById('wordDisplay').innerText = status.join(" ");
    }

    function check() {
        if(!status.includes("_")) end(true, "¡VICTORIA! 🎉");
        else if(fails >= 6) end(false, "PERDISTE 💀");
    }

    function end(win, txt) {
        clearInterval(timerInterval);
        const m = document.getElementById('msg');
        m.innerText = txt;
        m.style.color = win ? "var(--p)" : "var(--d)";
        if(!win) m.innerHTML += `<br><small style="color:#94a3b8">Era: ${target}</small>`;
        document.getElementById('kb').style.pointerEvents = 'none';
        document.getElementById('btn-res').classList.remove('hidden');
    }
</script>
</body>
</html>
